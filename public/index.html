<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000805">
<meta name="description" content="RAMZY ULTIMITE V6 BOT — multipurpose WhatsApp bot.">
<title>RAMZY ULTIMITE V6 BOT</title>
<style>
:root{color-scheme:dark;--green:#28ff38}
*{box-sizing:border-box}
html{min-height:100%;background:#000}
body{margin:0;min-height:100vh;background:#000805;color:#fff;font-family:Arial,Helvetica,sans-serif}
#loader{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;background:radial-gradient(circle at center,#062d17 0,#000805 68%);transition:opacity .45s ease,visibility .45s ease}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-logo{display:block;width:min(68vw,280px);height:auto;aspect-ratio:1;object-fit:contain;border-radius:50%;filter:drop-shadow(0 0 16px #28ff3880)}
.loadtitle{font-size:clamp(20px,5vw,32px);font-weight:900;text-align:center;letter-spacing:1px}
.loadtitle span{color:var(--green)}
.loadsub{font-size:10px;letter-spacing:3px;color:#91ffab;text-align:center}
.loadline{width:170px;height:4px;background:#124020;overflow:hidden;border-radius:5px}
.loadline:after{content:"";display:block;width:45%;height:100%;background:var(--green);animation:load 1s infinite}
main{width:100%;max-width:1248px;margin:0 auto;padding:0}
.poster{display:block;width:100%;height:auto;object-fit:contain}
@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(300%)}}
@media(min-width:1249px){main{padding:18px 0}.poster{border-radius:4px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="loader" aria-label="Loading RAMZY ULTIMITE V6 BOT">
<img class="loader-logo" src="/ramzy-logo.png" alt="RAMZY ULTIMITE V6 crowned robot logo">
<div class="loadtitle">RAMZY <span>ULTIMITE V6</span> BOT</div>
<div class="loadsub">MORE THAN JUST A BOT</div>
<div class="loadline" aria-hidden="true"></div>
</div>
<main>
<img class="poster" src="/ramzy-poster.png" alt="RAMZY ULTIMITE V6 BOT promotional poster showing features and commands" fetchpriority="high">
</main>
<script>
window.addEventListener("load",()=>setTimeout(()=>document.getElementById("loader")?.classList.add("hide"),1700));
</script>
</body>
</html>
