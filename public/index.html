<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#031008">
<title>RAMZY ULTIMATE V6 BOT</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#030806;color:#eaffed;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:radial-gradient(ellipse at center,#0b2413 0%,#030806 68%);transition:opacity .45s ease,visibility .45s ease}
#loader.hide{opacity:0;visibility:hidden}.mark{width:min(62vw,240px);aspect-ratio:1;display:grid;place-items:center;border:2px solid #39ff6a;border-radius:28%;color:#39ff6a;box-shadow:0 0 24px #39ff6a55,inset 0 0 22px #39ff6a22;font-size:clamp(46px,14vw,78px);font-weight:900;letter-spacing:-5px;animation:pulse 1.3s ease-in-out infinite alternate}
h1{margin:8px 14px 0;font-size:clamp(21px,5vw,32px);letter-spacing:1.5px}h1 span{color:#39ff6a}p{margin:0 16px;color:#b4d9bc}.bar{width:170px;height:5px;border-radius:9px;overflow:hidden;background:#173421;margin-top:8px}.bar i{display:block;height:100%;width:40%;background:#39ff6a;animation:move 1s ease-in-out infinite}
main{max-width:760px;margin:auto;padding:40px 20px;text-align:center}.tag{color:#39ff6a;font-weight:700}.panel{border:1px solid #245333;border-radius:16px;padding:18px;margin-top:22px;background:#07130b}code{color:#8cffaa}
@keyframes pulse{from{transform:scale(.97);filter:drop-shadow(0 0 4px #39ff6a)}to{transform:scale(1.03);filter:drop-shadow(0 0 18px #39ff6a)}}@keyframes move{from{transform:translateX(-120%)}to{transform:translateX(360%)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>

<main><p class="tag">MORE THAN JUST A BOT!</p><h1>RAMZY ULTIMATE V6 BOT</h1><p>Your multipurpose bot project starts here.</p><section class="panel"><h2>Starter project is online-ready</h2><p>This is the first web shell. WhatsApp pairing and bot commands are not connected yet.</p><p>Health check: <code>/health</code></p></section></main>
